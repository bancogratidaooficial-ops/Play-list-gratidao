<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>V86 PLAY LIST</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#FFD700">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#000;color:#fff;padding-bottom:20px}
.topo{background:linear-gradient(135deg,#FFD700,#FFA500);color:#000;padding:20px;text-align:center}
.topo h1{font-size:28px}
.player-box{margin:15px;background:#111;border-radius:16px;overflow:hidden;border:2px solid #FFD700}
#player{width:100%;height:220px;background:#000}
.controles{display:flex;justify-content:space-around;align-items:center;padding:15px;background:#1a1a1a}
.btn-ctrl{background:#FFD700;color:#000;border:none;width:50px;height:50px;border-radius:50%;font-size:20px;font-weight:bold}
.btn-play{background:#FFD700;color:#000;border:none;width:70px;height:70px;border-radius:50%;font-size:30px;font-weight:bold}
.info-musica{padding:15px;text-align:center}
.info-musica h3{color:#FFD700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn-add{display:block;width:calc(100% - 30px);margin:15px;padding:16px;background:#25D366;color:white;border:none;border-radius:12px;font-weight:bold;font-size:16px;text-align:center}
.lista{margin:15px}
.item{background:#1a1a1a;padding:12px;border-radius:10px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;border-left:4px solid #FFD700}
.item.ativo{background:#332b00;border-left-color:#25D366}
.item b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:200px}
.item span{font-size:12px;color:#888}
</style>
</head>
<body>
<div class="topo">
<h1>V86 PLAY LIST 🎵</h1>
<p>Seu som direto do celular</p>
</div>

<div class="player-box">
<video id="player" controls playsinline></video>
<div class="info-musica">
<h3 id="nomeAtual">Nenhuma música selecionada</h3>
<p id="contador" style="font-size:12px;color:#888">0 músicas</p>
</div>
<div class="controles">
<button class="btn-ctrl" onclick="anterior()">⏮</button>
<button class="btn-play" id="btnPlay" onclick="playPause()">▶️</button>
<button class="btn-ctrl" onclick="proxima()">⏭</button>
</div>
</div>

<input type="file" id="inputFile" accept="audio/*,video/*" multiple style="display:none">
<button class="btn-add" onclick="document.getElementById('inputFile').click()">➕ Adicionar Músicas e Vídeos do Celular</button>

<div class="lista" id="lista"></div>

<button id="btnInstalar" style="display:none; width: calc(100% - 30px); margin: 15px; padding: 14px; background: #ffcc00; color: #000; border: none; border-radius: 12px; font-weight: bold; font-size: 16px;">📲 Instalar App V86 PLAY</button>

<script>
let db;
let musicas = [];
let indiceAtual = -1;
let urls = {};

const request = indexedDB.open('V86PlayDB', 1);
request.onupgradeneeded = e => {
  e.target.result.createObjectStore('musicas', {keyPath: 'id', autoIncrement: true});
};
request.onsuccess = e => {
  db = e.target.result;
  carregarMusicas();
};
request.onerror = () => alert('Erro no banco de dados');

function carregarMusicas(){
  const tx = db.transaction('musicas', 'readonly');
  const store = tx.objectStore('musicas');
  const req = store.getAll();
  req.onsuccess = () => {
    musicas = req.result;
    // cria URL para cada blob
    musicas.forEach(m => {
      if(urls[m.id]) URL.revokeObjectURL(urls[m.id]);
      urls[m.id] = URL.createObjectURL(m.blob);
    });
    atualizarLista();
  };
}

document.getElementById('inputFile').addEventListener('change', async (e)=>{
  const arquivos = e.target.files;
  if(!arquivos.length) return;
  const tx = db.transaction('musicas', 'readwrite');
  const store = tx.objectStore('musicas');
  for(let file of arquivos){
    await new Promise(res=>{
      const r = store.add({nome: file.name, tipo: file.type, blob: file});
      r.onsuccess = res;
    });
  }
  tx.oncomplete = carregarMusicas;
  e.target.value = '';
});

function atualizarLista(){
  const lista = document.getElementById('lista');
  document.getElementById('contador').innerText = musicas.length + ' músicas/vídeos';
  lista.innerHTML = '';
  musicas.forEach((m, i)=>{
    const ativo = i === indiceAtual? 'ativo' : '';
    lista.innerHTML += `<div class="item ${ativo}" onclick="tocar(${i})"><div><b>${m.nome}</b><span>${m.tipo.includes('video')? '🎬 Vídeo' : '🎵 Áudio'}</span></div><div><span onclick="event.stopPropagation(); remover(${m.id})" style="color:red;padding:10px">🗑️</span></div></div>`;
  });
}

function tocar(i){
  indiceAtual = i;
  const m = musicas[i];
  const player = document.getElementById('player');
  player.src = urls[m.id];
  player.play();
  document.getElementById('nomeAtual').innerText = m.nome;
  document.getElementById('btnPlay').innerText = '⏸️';
  atualizarLista();
}

function playPause(){
  const player = document.getElementById('player');
  if(player.paused){
    if(indiceAtual === -1 && musicas.length > 0) tocar(0);
    else player.play();
    document.getElementById('btnPlay').innerText = '⏸️';
  } else {
    player.pause();
    document.getElementById('btnPlay').innerText = '▶️';
  }
}

function proxima(){
  if(!musicas.length) return;
  let prox = indiceAtual + 1;
  if(prox >= musicas.length) prox = 0;
  tocar(prox);
}

function anterior(){
  if(!musicas.length) return;
  let ant = indiceAtual - 1;
  if(ant < 0) ant = musicas.length - 1;
  tocar(ant);
}

function remover(id){
  if(!confirm('Remover essa música?')) return;
  const tx = db.transaction('musicas', 'readwrite');
  tx.objectStore('musicas').delete(id);
  tx.oncomplete = ()=>{
    URL.revokeObjectURL(urls[id]);
    delete urls[id];
    if(musicas[indiceAtual] && musicas[indiceAtual].id === id){
      document.getElementById('player').pause();
      document.getElementById('player').src = '';
      indiceAtual = -1;
      document.getElementById('nomeAtual').innerText = 'Nenhuma música selecionada';
    }
    carregarMusicas();
  };
}

document.getElementById('player').addEventListener('ended', proxima);

// BOTÃO INSTALAR
let appParaInstalar = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  appParaInstalar = e;
  document.getElementById('btnInstalar').style.display = 'block';
});
document.getElementById('btnInstalar').addEventListener('click', async () => {
  if (!appParaInstalar) return;
  appParaInstalar.prompt();
  await appParaInstalar.userChoice;
  document.getElementById('btnInstalar').style.display = 'none';
  appParaInstalar = null;
});
</script>
</body>
</html>
